<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b120c" />
  <title>Yard Queue</title>
  <style>
    :root { --bg:#0b120c; --card:#1a2a1c; --card-2:#223426; --ink:#f3f6ee; --muted:#b7c4b0; --line:#314636; --amber:#f0b429; --amber-2:#ffd56a; --good:#8fd19e; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; }
    body { padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom)); max-width:720px; margin:0 auto; }
    h1 { font-size:1.15rem; margin:0; }
    .sub { color:var(--muted); font-size:.92rem; margin-top:4px; }
    header { display:flex; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .badge { background:var(--card); border:1px solid var(--line); color:var(--amber-2); border-radius:999px; padding:8px 12px; font-size:.78rem; height:fit-content; }
    .now { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px 16px 16px; margin-bottom:14px; }
    .kicker { color:var(--amber); font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .title { font-size:1.35rem; line-height:1.25; margin:8px 0 14px; font-weight:750; }
    .times { display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; margin-top:6px; }
    input[type=range] { width:100%; height:28px; accent-color:var(--amber); }
    .controls { display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:10px; margin:14px 0 10px; }
    button { border:0; border-radius:18px; background:var(--card-2); color:var(--ink); font-weight:700; font-size:1rem; min-height:64px; box-shadow:inset 0 0 0 1px var(--line); }
    button.play { background:var(--amber); color:#1a1403; font-size:1.35rem; min-height:84px; }
    .row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .row button { min-height:52px; font-size:.92rem; }
    .tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    .tools button { min-height:56px; }
    #rand { width:100%; min-height:64px; margin-top:10px; background:#3a4f2a; }
    .warn,.ok,.hint { border-radius:14px; padding:12px; margin:0 0 12px; font-size:.95rem; line-height:1.45; }
    .warn { background:#3a2418; color:#ffd7c4; }
    .ok { background:#1c3324; color:var(--good); }
    .hint { background:#142016; color:var(--muted); }
    .list { display:flex; flex-direction:column; gap:8px; }
    .ep { text-align:left; padding:14px; border-radius:16px; background:var(--card); display:grid; grid-template-columns:54px 1fr; gap:10px; align-items:center; min-height:72px; }
    .ep.on { outline:2px solid var(--amber); }
    .num { width:54px; height:54px; border-radius:14px; background:#243328; display:grid; place-items:center; font-weight:800; color:var(--amber-2); }
    .ep small { color:var(--muted); }
    audio { width:100%; margin-top:12px; }
    a { color:var(--amber-2); }
  </style>
</head>
<body>
  <header>
    <div><h1>Yard Queue</h1><div class="sub">Tap 01, then Play. Skip 00 if it hangs.</div></div>
    <div class="badge" id="sourceBadge">Drive stream</div>
  </header>
  <div class="hint" id="howto">If the big yellow Play does nothing, use the gray bar under the buttons. That is the phone&rsquo;s own player.</div>
  <div id="msg"></div>
  <section class="now">
    <div class="kicker" id="kicker">Ready</div>
    <div class="title" id="nowTitle">Pick a segment</div>
    <input id="seek" type="range" min="0" max="1000" value="0" />
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="controls">
      <button id="prev" type="button">Prev</button>
      <button class="play" id="play" type="button">Play</button>
      <button id="next" type="button">Next</button>
    </div>
    <div class="row">
      <button id="back15" type="button">-15s</button>
      <button id="fwd15" type="button">+15s</button>
      <button id="back30" type="button">-30s</button>
      <button id="fwd30" type="button">+30s</button>
    </div>
    <button id="rand" type="button">Play random</button>
    <div class="tools">
      <button id="speedBtn" type="button">Speed 1.0x</button>
      <button id="sleepBtn" type="button">Sleep off</button>
      <button id="wakeBtn" type="button">Screen: normal</button>
      <button id="driveBtn" type="button">Open in Drive</button>
    </div>
    <audio id="audio" controls playsinline preload="auto" referrerpolicy="no-referrer"></audio>
  </section>
  <div class="list" id="list"></div>
  <script>
    const EPISODES = [
      { n:"01", title:"Support Process Audit Briefing", id:"1z7CEvL_DXGDxgg5ibcLetM262cRmkN7G" },
      { n:"02", title:"The Offer", id:"169nDNWfIijq43oQqTpM28cLRgGgRc8R5" },
      { n:"03", title:"How to Compete", id:"197l-PbKBAwIvVKtRBMJhoqsJu9JMfEA-" },
      { n:"04", title:"First 30 Days", id:"1PT0rxkcZMvslNekkXMlgDckdpb7hQpOq" },
      { n:"05", title:"What the Report Contains", id:"1Uuk_dsCrukrsCBJDDKcQSN_xgV4UyOJK" },
      { n:"06", title:"Safety, Growth, and Stop Rules", id:"1BC6fCAzrPjZDad0679zdLDGlPJXjvjn6" },
      { n:"07", title:"Cross Timbers Sand and Stripped Topsoil", id:"1cywO3v4tzq1I9Z5IQIxbCfZuf6ssEyui" },
      { n:"08", title:"Proposal Language", id:"1IepQRYqy6PqaRfg8uTd5XirqOncXBlcM" },
      { n:"09", title:"Common Objections", id:"1M8yi3s4WeE2r5wjrbRjkfOXas-cOk5vD" },
      { n:"10", title:"Job Search vs Side Gig Boundary", id:"1PceEB1CDBuEQj6ZGq89zQMkgs1nOC-Rh" },
      { n:"12", title:"What Is Burrowing Under the Grass", id:"1hBxR9-n3KxyG4lJ8a-O6OpdIFpL2D2kV" },
      { n:"13", title:"Technical Support Certifications", id:"1JaAvdjnrtvrZc4hdL4t_uzYOdOjKQ3Qv" },
      { n:"14", title:"Top Complaints from Support Managers", id:"1Ehsn9fxrtuAE8YKDTFd9ni5k2xFCNN96" },
      { n:"15", title:"How Companies Implement CRM", id:"1jHG3Z5173qmena44cKMTlQwC0tFMcp_o" },
      { n:"16", title:"How CSAT Is Gathered and Evaluated", id:"177QHrNbqvIdYUzxBfIyw5UWWygV-z_Sp" },
      { n:"17", title:"Paid vs Free Technical Support Expectations", id:"1vCbtZ2Meezn4RS0Tt6XfxejX0LuyJPjP" },
      { n:"18", title:"Post Oak Shade and Front Yard Split", id:"1_iGlELm65QQ6MfUi02LYpPqKvWVuN6Xr" },
      { n:"19", title:"Heat Tools for Sand and Shade", id:"1LVnGSidoSX90KLPYDrqS7dSIHdblSs65" },
      { n:"20", title:"Espalier Food and Spice on the North Fence", id:"13ssb9b1j8HSkHGjkLiLxuH5EAlW0Z36H" },
      { n:"00", title:"Full Yard Work Queue (34 min)", id:"1uRvWAny_eq--MZ1p7E1iHxfbGd3b2lYg" }
    ];
    const audio=document.getElementById("audio");
    const seek=document.getElementById("seek");
    const playBtn=document.getElementById("play");
    const speeds=[1,1.2,1.5,0.9], sleeps=[0,10,20,30,45];
    let speedIdx=0,sleepIdx=0,sleepUntil=0,idx=0,urlIdx=0,wakeLock=null,shuffle=false;
    const SAVE="yard-queue-v3";
    function driveUrls(id){return[
      "https://drive.usercontent.google.com/download?id="+id+"&export=download",
      "https://drive.google.com/uc?export=download&id="+id
    ];}
    function fmt(t){if(!isFinite(t)||t<0)return"0:00";const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+String(s).padStart(2,"0");}
    function state(){try{return JSON.parse(localStorage.getItem(SAVE)||"{}");}catch{return{};}}
    function save(p){localStorage.setItem(SAVE,JSON.stringify(Object.assign(state(),p)));}
    function msg(html,kind){const el=document.getElementById("msg");if(!html){el.innerHTML="";return;}el.innerHTML='<div class="'+(kind||"ok")+'">'+html+"</div>";}
    function renderList(){document.getElementById("list").innerHTML=EPISODES.map((ep,i)=>'<button class="ep'+(i===idx?" on":"")+'" data-i="'+i+'" type="button"><div class="num">'+ep.n+'</div><div><b>'+ep.title+'</b><small>Drive stream</small></div></button>').join("");}
    function mediaSession(ep){if(!("mediaSession"in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:ep.title,artist:"Yard Queue"});navigator.mediaSession.setActionHandler("play",()=>audio.play());navigator.mediaSession.setActionHandler("pause",()=>audio.pause());navigator.mediaSession.setActionHandler("previoustrack",()=>load(idx-1,true));navigator.mediaSession.setActionHandler("nexttrack",()=>load(idx+1,true));}
    function attach(autoplay){const ep=EPISODES[idx];audio.src=driveUrls(ep.id)[urlIdx];audio.playbackRate=speeds[speedIdx];audio.onloadedmetadata=()=>{document.getElementById("sourceBadge").textContent="Streaming";msg("Streaming. Leave this tab open.");const resume=(state().pos||{})[ep.n]||0;if(resume>3&&resume<(audio.duration||1e9)-3)audio.currentTime=resume;if(autoplay)audio.play().catch(()=>msg("Tap the gray audio bar under the buttons.","warn"));};}
    function playRandom(){let i=Math.floor(Math.random()* (EPISODES.length-1));if(i===idx)i=(i+1)%(EPISODES.length-1);shuffle=true;document.getElementById("rand").textContent="Random on";load(i,true);}
    function load(i,autoplay){idx=(i+EPISODES.length)%EPISODES.length;urlIdx=0;const ep=EPISODES[idx];document.getElementById("kicker").textContent="Segment "+ep.n;document.getElementById("nowTitle").textContent=ep.title;renderList();save({idx});mediaSession(ep);if(autoplay)attach(true);}
    audio.addEventListener("error",()=>{if(urlIdx<1){urlIdx=1;attach(true);return;}if(EPISODES[idx].n==="00"){msg("Full mix is busy. Opening 01.","warn");load(0,true);return;}msg("Could not start. Tap Open in Drive.","warn");});
    document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)load(+b.dataset.i,true);});
    playBtn.onclick=()=>{if(!audio.src||audio.error){load(idx,true);return;}if(audio.paused)audio.play().catch(()=>msg("Tap the gray audio bar.","warn"));else audio.pause();};
    document.getElementById("prev").onclick=()=>load(idx-1,true);
    document.getElementById("next").onclick=()=>load(idx+1,true);
    document.getElementById("back15").onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);
    document.getElementById("fwd15").onclick=()=>audio.currentTime+=15;
    document.getElementById("back30").onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-30);
    document.getElementById("fwd30").onclick=()=>audio.currentTime+=30;
    document.getElementById("rand").onclick=playRandom;
    document.getElementById("speedBtn").onclick=()=>{speedIdx=(speedIdx+1)%speeds.length;audio.playbackRate=speeds[speedIdx];document.getElementById("speedBtn").textContent="Speed "+speeds[speedIdx].toFixed(1)+"x";};
    document.getElementById("sleepBtn").onclick=()=>{sleepIdx=(sleepIdx+1)%sleeps.length;const m=sleeps[sleepIdx];sleepUntil=m?Date.now()+m*60000:0;document.getElementById("sleepBtn").textContent=m?"Sleep "+m+"m":"Sleep off";};
    document.getElementById("wakeBtn").onclick=async()=>{try{if(wakeLock){await wakeLock.release();wakeLock=null;document.getElementById("wakeBtn").textContent="Screen: normal";return;}wakeLock=await navigator.wakeLock.request("screen");document.getElementById("wakeBtn").textContent="Screen: stay on";}catch{}};
    document.getElementById("driveBtn").onclick=()=>window.open("https://drive.google.com/file/d/"+EPISODES[idx].id+"/view","_blank");
    seek.oninput=()=>{if(audio.duration)audio.currentTime=(seek.value/1000)*audio.duration;};
    audio.addEventListener("play",()=>playBtn.textContent="Pause");
    audio.addEventListener("pause",()=>playBtn.textContent="Play");
    audio.addEventListener("timeupdate",()=>{if(audio.duration)seek.value=Math.round((audio.currentTime/audio.duration)*1000);document.getElementById("cur").textContent=fmt(audio.currentTime);document.getElementById("dur").textContent=fmt(audio.duration);const pos=state().pos||{};pos[EPISODES[idx].n]=audio.currentTime;save({pos,idx});if(sleepUntil&&Date.now()>=sleepUntil){audio.pause();sleepUntil=0;sleepIdx=0;document.getElementById("sleepBtn").textContent="Sleep off";}});
    audio.addEventListener("ended",()=>{if(shuffle)playRandom();else load(idx+1,true);});
    const saved=state();idx=Number.isInteger(saved.idx)?saved.idx:0;load(idx,false);
  </script>
</body>
</html>
